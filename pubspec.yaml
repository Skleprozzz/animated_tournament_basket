name: animated_tournament_basket
description: >-
  Animated single-elimination tournament bracket with connector paths,
  round transitions, and customizable match slot widgets.
version: 0.1.1
homepage: https://github.com/example/animated_tournament_basket
repository: https://github.com/example/animated_tournament_basket

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

screenshots:
  - description: Playoff bracket with round tabs and slide animation.
    path: doc/bracket_demo.gif